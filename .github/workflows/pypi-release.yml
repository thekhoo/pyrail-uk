name: PyPI Release

# Starts once release-please has tagged a release. Publishes that tag to PyPI.
# The PyPI trusted publisher must name this file (pypi-release.yml) and the environment
# (production).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (for example v1.1.0)
        required: true

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # must match the environment on the PyPI trusted publisher
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # An action, not a reusable workflow: PyPI trusted publishing rejects reusable
      # workflows from another repository.
      - uses: thekhoo/github-actions-shared/.github/actions/python-pypi-publish@main
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
