name: PyPI Release

# Starts once release-please has tagged a release. Publishes that tag to PyPI.
# The PyPI trusted publisher must name this file (pypi-release.yml) and the environment
# (production, the default of python-pypi-publish).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (for example v1.1.0)
        required: true

jobs:
  publish:
    name: Publish
    permissions:
      contents: read
      id-token: write
    uses: thekhoo/github-actions-shared/.github/workflows/python-pypi-publish.yml@main
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
