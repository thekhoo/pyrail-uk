name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  commit-messages:
    name: Commit Messages
    uses: thekhoo/github-actions-shared/.github/workflows/conventional-commits.yml@main

  checks:
    name: PR
    uses: ./.github/workflows/checks.yml
