name: Publish

# Starts once release-please has tagged a release. Publishes that tag to PyPI.
# The PyPI trusted publisher must name this file (publish.yml) and the environment below.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (for example v1.1.0)
        required: true

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
