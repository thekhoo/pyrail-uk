name: Release

# On merge to main: run the same checks as CI, then github-tag-release (release-please)
# updates the release PR. When that PR is merged, it tags the release and creates the
# GitHub Release. pypi-release.yml starts from that release.
on:
  push:
    branches: [main]

jobs:
  checks:
    name: Main
    uses: ./.github/workflows/checks.yml

  tag-release:
    name: Tag Release
    needs: checks
    uses: thekhoo/github-actions-shared/.github/workflows/github-tag-release.yml@main
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      auto-merge: true
    secrets:
      private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
