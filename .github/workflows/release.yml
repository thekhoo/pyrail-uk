name: Release

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    uses: thekhoo/github-actions-shared/.github/workflows/python-ci.yml@main
    with:
      linting-python-version: "3.13"
      pytest-python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      lint-directories: "pyrail_uk/ tests/"
      use-ruff: true
      use-pyrefly: true
      test-directories: "tests/"

  release-please:
    name: Release Please
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The app token (not GITHUB_TOKEN) lets the release PR trigger CI and pass the ruleset.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # must match the environment configured on the PyPI trusted publisher
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
