name: Release

# On merge to main: run the same checks as CI, then let release-please update the
# release PR. When that PR is merged, release-please tags the release and creates the
# GitHub Release. publish.yml starts from that release.
on:
  push:
    branches: [main]

jobs:
  checks:
    name: Main
    uses: ./.github/workflows/checks.yml

  release-please:
    name: Release Please
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # The app token (not GITHUB_TOKEN) lets the release PR trigger CI, and lets the
      # GitHub Release it creates trigger publish.yml.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
