name: Release

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    uses: thekhoo/github-actions-shared/.github/workflows/python-ci.yml@main
    with:
      linting-python-version: "3.13"
      pytest-python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      lint-directories: "pyrail_uk/ tests/"
      use-ruff: true
      use-pyrefly: true
      test-directories: "tests/"

  release:
    name: Semantic Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          commit: "false"

      - name: Publish | Upload to GitHub Release Assets
        uses: python-semantic-release/publish-action@v10.6.1
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Upload | Distribution Artifacts
        uses: actions/upload-artifact@v7.0.1
        if: steps.release.outputs.released == 'true'
        with:
          name: distribution-artifacts
          path: dist
          if-no-files-found: error

    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}

  deploy:
    runs-on: ubuntu-latest
    needs: release
    environment: production
    if: ${{ needs.release.outputs.released == 'true' }}
    steps:
      - name: Download | Distribution Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: distribution-artifacts
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
